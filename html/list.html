<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!--ordered list--->
    <ol>
        <li>dosa</li>
        <li>idly</li>
        <li>pasta</li>
        <li>maggi</li>
    </ol>
    <hr>
    <!--unordered list-->
    <ul>
        <li>chapati</li>
        <li>milk</li>
        <li>tea</li>
        <li>blacktea</li>
    </ul>
    <hr>

    <!--defination list-->
    <dt type ='*'> pasta
        <dd>It is the italian dish</dd>
        
    
    
</body>
</html>
